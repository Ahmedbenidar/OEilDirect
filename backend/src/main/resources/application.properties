spring.application.name=backend
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/oeildirectdb?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# JWT (HS256 — utiliser une clé forte en production, idéalement base64 32+ octets)
app.jwt.secret=oeildirect-dev-jwt-secret-change-in-production-min-48-chars!!
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
